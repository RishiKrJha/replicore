<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vault</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><strong>VAULT</strong><span>local distributed object storage</span>{% if session.admin %}<a href="{{ url_for('portal.admin_dashboard') }}">Admin Portal</a><form method="post" action="{{ url_for('portal.logout') }}"><button>Log out</button></form>{% else %}<a href="{{ url_for('portal.admin_dashboard') }}">Admin login</a>{% endif %}</header><main>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
